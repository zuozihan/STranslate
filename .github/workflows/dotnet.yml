name: Public STranslate

# https://github.com/softprops/action-gh-release/issues/236#issuecomment-1150530128
# 无需 Token 即可发布
permissions:
  contents: write

on:
  release:
    types: [published]
  push:
    tags:
      - "*" # Push events to matching *, i.e. 1.0, 20.15.10
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: '发布/打包版本号 (留空则自动推算)'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest # 添加EnableWindowsTargeting可支持跨平台编译WPF项目

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install vpk
      run: dotnet tool install -g vpk

    - name: Build and Pack
      shell: pwsh
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      run: |
        $ver = $env:INPUT_VERSION
        if ([string]::IsNullOrWhiteSpace($ver)) {
            if ($env:GITHUB_REF -like "refs/tags/*") {
                $ver = $env:GITHUB_REF_NAME
            }
        }
        if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "main") {
            try {
                $latest = (Invoke-RestMethod -Uri "https://api.github.com/repos/STranslate/STranslate/releases/latest" -Headers @{ "User-Agent" = "STranslate-CI" }).tag_name -replace '^v', ''
                if ($latest -match '^\d+\.\d+\.\d+') {
                    $parts = $latest.Split('.')
                    $parts[-1] = [int]$parts[-1] + 1
                    $ver = ($parts -join '.')
                } else {
                    $ver = "2.0.11"
                }
            } catch {
                $ver = "2.0.11"
            }
        }
        $CleanVersion = $ver -replace '^v', ''
        Write-Host "Resolved Version for Packaging: $CleanVersion" -ForegroundColor Green
        "PACKAGE_VERSION=$CleanVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        .\build.ps1 -Version $CleanVersion
        .\post_build.ps1 -Version $CleanVersion -RepoUrl $env:REPO_URL

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: STranslate-win-${{ env.PACKAGE_VERSION }}
        path: |
          publish/*
        if-no-files-found: error

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        tag_name: ${{ github.ref_name }}
        body_path: CHANGELOG.md
        draft: false # 设置为 false 可立即发布版本
        files: |
          publish/*
